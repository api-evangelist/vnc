- aid: vnc:vnc-sdk
  name: VNC Developer SDK
  description: >-
    Cross-platform SDK for embedding VNC Viewer and Server functionality into applications. Available
    for C, Java, Python, .NET, and JavaScript. Supports direct TCP/UDP connections, VNC Cloud brokering,
    end-to-end AES-128 encryption, custom messaging, multi-display, clipboard sharing, and screen annotations.
  humanURL: https://www.realvnc.com/en/developer/docs/latest/overview.html
