apis:
- aid: vnc:vnc-connect-api
  name: VNC Connect Management API
  description: >-
    The VNC Connect API Access feature enables programmatic management of devices registered to a team
    account, supporting device inventory, renaming, deduplication, and integration with ITSM tools. Authenticated
    with team-scoped API access keys with granular permission control.
  humanURL: https://www.realvnc.com/en/connect/api-access/
